<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡網頁記帳本</title>
    <style>
        :root {
            --primary: #4a90e2;
            --income: #2ecc71;
            --expense: #e74c3c;
            --bg: #f5f7fa;
            --text: #333;
            --secondary: #7f8c8d;
            --border: #e2e8f0;
        }
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
        }
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
            min-height: 100vh;
        }
        .container { 
            width: 100%; 
            max-width: 500px; 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            margin-bottom: 40px;
        }
        h1 { 
            text-align: center; 
            margin-bottom: 20px; 
            font-size: 24px; 
            color: #2c3e50; 
        }
        
        /* 儀表板 RWD 自適應 */
        .balance-board { 
            display: flex; 
            justify-content: space-between; 
            background: #f8f9fa; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            text-align: center; 
            gap: 10px;
        }
        .board-item { 
            flex: 1; 
            min-width: 0; /* 防止文字溢出破壞佈局 */
        }
        .board-item:not(:last-child) { 
            border-right: 1px solid #dee2e6; 
        }
        .board-item p { 
            font-size: 12px; 
            color: #7f8c8d; 
            margin-bottom: 5px; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .board-item span { 
            font-size: 16px; 
            font-weight: bold; 
            word-break: break-all;
            display: block;
        }
        #total-balance { color: var(--primary); }
        #total-income { color: var(--income); }
        #total-expense { color: var(--expense); }

        /* 表單 */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 600; }
        input, select { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-size: 14px; 
            outline: none; 
            background-color: #fff;
            -webkit-appearance: none; /* 移除行動裝置內建樣式 */
        }
        input:focus, select:focus { border-color: var(--primary); }
        
        .radio-group { display: flex; gap: 20px; margin-top: 8px; margin-bottom: 8px; }
        .radio-group label { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            font-weight: normal; 
            cursor: pointer; 
            margin-bottom: 0;
        }
        .radio-group input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        button { 
            width: 100%; 
            padding: 12px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        button:hover { background: #357abd; }

        /* 歷史明細 */
        .history { margin-top: 25px; }
        .history h3 { font-size: 16px; margin-bottom: 10px; border-bottom: 2px solid #f1f1f1; padding-bottom: 5px; }
        .list-container { max-height: 250px; overflow-y: auto; margin-bottom: 20px; }
        
        /* 修正列表防跑版佈局 */
        .item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px; 
            margin-bottom: 8px; 
            border-radius: 6px; 
            background: #fff; 
            border-left: 5px solid #ccc; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.02); 
            gap: 15px;
        }
        .item.income { border-left-color: var(--income); }
        .item.expense { border-left-color: var(--expense); }
        
        .item-info { 
            display: flex; 
            flex-direction: column; 
            gap: 2px; 
            flex: 1; 
            min-width: 0; /* 關鍵：允許子元素縮小，防止擠開版面 */
        }
        .item-title { 
            font-weight: 600; 
            font-size: 14px; 
            word-break: break-all; /* 自動斷行防止長英文字串爆版 */
        }
        .item-date { font-size: 11px; color: #95a5a6; }
        
        .item-amount { 
            font-weight: bold; 
            font-size: 15px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            flex-shrink: 0; /* 防止金額欄位被壓縮 */
        }
        .delete-btn { 
            background: none; 
            border: none; 
            color: #bdc3c7; 
            cursor: pointer; 
            font-size: 20px; 
            padding: 0 5px; 
            width: auto; 
            line-height: 1;
        }
        .delete-btn:hover { color: var(--expense); }

        /* 備份按鈕區塊 RWD */
        .backup-actions { 
            display: flex; 
            gap: 10px; 
            margin-top: 15px; 
            border-top: 1px dashed #dee2e6; 
            padding-top: 15px; 
        }
        .btn-secondary { background: var(--secondary); font-size: 14px; padding: 10px; }
        .btn-secondary:hover { background: #677576; }
        #file-input { display: none; }

        @media (max-width: 400px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .balance-board { padding: 10px; gap: 5px; }
            .board-item span { font-size: 14px; }
            .backup-actions { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>我的記帳本</h1>

        <!-- 餘額儀表板 -->
        <div class="balance-board">
            <div class="board-item">
                <p>總餘額</p>
                <span id="total-balance">$0</span>
            </div>
            <div class="board-item">
                <p>總收入</p>
                <span id="total-income">$0</span>
            </div>
            <div class="board-item">
                <p>總支出</p>
                <span id="total-expense">$0</span>
            </div>
        </div>

        <!-- 新增帳目表單 -->
        <form id="ledger-form">
            <div class="form-group">
                <label>種類</label>
                <div class="radio-group">
                    <label><input type="radio" name="type" value="expense" checked> 支出</label>
                    <label><input type="radio" name="type" value="income"> 收入</label>
                </div>
            </div>
            <div class="form-group">
                <label for="text">項目名稱</label>
                <input type="text" id="text" placeholder="例如：午餐、薪水..." required>
            </div>
            <div class="form-group">
                <label for="amount">金額</label>
                <input type="number" id="amount" placeholder="請輸入金額" min="1" required>
            </div>
            <button type="submit">新增紀錄</button>
        </form>

        <!-- 歷史紀錄 -->
        <div class="history">
            <h3>歷史明細</h3>
            <div class="list-container" id="list">
                <!-- 帳目會透過 JS 動態產生於此 -->
            </div>
        </div>

        <!-- 匯入/匯出按鈕 -->
        <div class="backup-actions">
            <button type="button" class="btn-secondary" id="export-btn">匯出備份 (JSON)</button>
            <button type="button" class="btn-secondary" id="import-trigger-btn">匯入備份 (JSON)</button>
            <input type="file" id="file-input" accept=".json">
        </div>
    </div>

    <script>
        const balance = document.getElementById('total-balance');
        const income = document.getElementById('total-income');
        const expense = document.getElementById('total-expense');
        const list = document.getElementById('list');
        const form = document.getElementById('ledger-form');
        const text = document.getElementById('text');
        const amount = document.getElementById('amount');
        
        const exportBtn = document.getElementById('export-btn');
        const importTriggerBtn = document.getElementById('import-trigger-btn');
        const fileInput = document.getElementById('file-input');

        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

        function addTransaction(e) {
            e.preventDefault();

            const selectedType = document.querySelector('input[name="type"]:checked').value;
            const today = new Date().toISOString().split('T')[0];

            const transaction = {
                id: generateID(),
                text: text.value,
                amount: selectedType === 'expense' ? -Math.abs(+amount.value) : Math.abs(+amount.value),
                date: today
            };

            transactions.push(transaction);
            updateDOM();
            updateLocalStorage();

            text.value = '';
            amount.value = '';
        }

        function generateID() {
            return Math.floor(Math.random() * 100000000);
        }

        function updateDOM() {
            list.innerHTML = '';

            transactions.forEach(transaction => {
                const sign = transaction.amount < 0 ? '-' : '+';
                const itemClass = transaction.amount < 0 ? 'expense' : 'income';
                
                const item = document.createElement('div');
                item.classList.add('item', itemClass);

                item.innerHTML = `
                    <div class="item-info">
                        <span class="item-title">${transaction.text}</span>
                        <span class="item-date">${transaction.date}</span>
                    </div>
                    <div class="item-amount">
                        <span>${sign}$${Math.abs(transaction.amount)}</span>
                        <button class="delete-btn" onclick="removeTransaction(${transaction.id})">&times;</button>
                    </div>
                `;

                list.appendChild(item);
            });

            updateValues();
        }

        function updateValues() {
            const amounts = transactions.map(t => t.amount);
            const total = amounts.reduce((acc, item) => (acc += item), 0);
            const inc = amounts.filter(item => item > 0).reduce((acc, item) => (acc += item), 0);
            const exp = amounts.filter(item => item < 0).reduce((acc, item) => (acc += item), 0) * -1;

            balance.innerText = `$${total}`;
            income.innerText = `$${inc}`;
            expense.innerText = `$${exp}`;
        }

        function removeTransaction(id) {
            transactions = transactions.filter(t => t.id !== id);
            updateLocalStorage();
            updateDOM();
        }

        function updateLocalStorage() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
        }

        exportBtn.addEventListener('click', () => {
            if (transactions.length === 0) {
                alert('目前沒有任何記帳資料可以匯出喔！');
                return;
            }
            const dataStr = JSON.stringify(transactions, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const downloadAnchor = document.createElement('a');
            const dateStr = new Date().toISOString().split('T')[0];
            downloadAnchor.href = url;
            downloadAnchor.download = `my_ledger_backup_${dateStr}.json`;
            downloadAnchor.click();
            URL.revokeObjectURL(url);
        });

        importTriggerBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const parsedData = JSON.parse(event.target.result);
                    if (Array.isArray(parsedData)) {
                        if (confirm('匯入備份將會覆蓋目前的記帳資料，確定要繼續嗎？')) {
                            transactions = parsedData;
                            updateLocalStorage();
                            updateDOM();
                            alert('資料匯入成功！');
                        }
                    } else {
                        alert('檔案格式錯誤，請確保該檔案是由此系統匯出的 JSON 檔。');
                    }
                } catch (error) {
                    alert('讀取檔案失敗，這可能不是一個正確的 JSON 檔案。');
                }
                fileInput.value = '';
            };
            reader.readAsText(file);
        });

        form.addEventListener('submit', addTransaction);
        updateDOM();
    </script>
</body>
</html>
